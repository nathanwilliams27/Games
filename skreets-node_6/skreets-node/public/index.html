<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Skreets of Maple Ridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Bungee&family=Black+Ops+One&family=Chewy&family=Bangers&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: the square 11x11 board is the stage, a narrow control rail sits beside it and stacks under it on phones */
:root{
  --bg:#e8edf1; --surface:#fbfcfd; --ink:#13202c; --muted:#596775; --line:#c6d0d9; --line-strong:#8e9ba8;
  --board:#f4f7f9; --center:#dce6ed; --accent:#1d4fb8; --accent-ink:#ffffff; --signal:#c2372a; --good:#1d7449;
  --g-brown:#8b5a3c; --g-sky:#62afd6; --g-plum:#b4447c; --g-amber:#e0832a; --g-red:#cc3930; --g-gold:#dfb424; --g-pine:#2b8753; --g-navy:#26408f;
  --f-display:"Bowlby One","Arial Black",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d141b; --surface:#151f29; --ink:#e3eaf0; --muted:#93a1ae; --line:#283643; --line-strong:#4b5c6c;
  --board:#111a23; --center:#172330; --accent:#6a96f2; --accent-ink:#0a1220; --signal:#f06b5b; --good:#52c48e;
  --g-brown:#a8714f; --g-navy:#4c6bcc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d141b; --surface:#151f29; --ink:#e3eaf0; --muted:#93a1ae; --line:#283643; --line-strong:#4b5c6c;
  --board:#111a23; --center:#172330; --accent:#6a96f2; --accent-ink:#0a1220; --signal:#f06b5b; --good:#52c48e;
  --g-brown:#a8714f; --g-navy:#4c6bcc; color-scheme:dark}

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
button,input,select{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1560px;margin:0 auto 14px}
.brand{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:13px;border:1px solid var(--line-strong);border-radius:999px;padding:3px 10px;background:var(--surface)}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;grid-template-areas:"left board right";gap:18px;max-width:1560px;margin:0 auto;align-items:start}
.boardwrap{grid-area:board;justify-self:center;position:relative;container-type:inline-size;width:min(100%,880px,max(340px,calc(100svh - 110px)))}
#fx{position:absolute;inset:0;pointer-events:none;z-index:6}
.fxtok{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
.fxtok .tok{position:absolute;left:0;top:0;transform:translate(-50%,-50%);box-shadow:0 6px 12px rgba(0,0,0,.4)}
.tok svg{width:70%;height:70%;fill:#fff;display:block}
.chars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.charbtn{display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);padding:7px 2px;cursor:pointer}
.charbtn small{font-size:11.5px;font-weight:600}
/* Home and waiting room page */
body.home-mode{overflow:auto;height:auto;display:block}
.home-inner{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-block:clamp(12px,4vh,40px) 24px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.hero-kicker{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hero-mark{font-family:var(--f-display);font-size:clamp(34px,7vw,66px);line-height:1;text-wrap:balance}
.hero-mark span{color:var(--accent)}
.hero-code{font-family:var(--f-mono);letter-spacing:.12em}
.hero-sub{margin:0;color:var(--muted);font-size:16px}
.bands{display:grid;grid-template-columns:repeat(8,1fr);width:min(100%,520px);height:12px;border-radius:4px;overflow:hidden;margin-top:6px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px;align-items:start}
.home-grid .card{padding:18px;gap:12px}
.home-grid .pl .tok{width:36px;height:36px}
.pill.auto{color:var(--good)}
.autosw{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--bg);border-radius:999px;padding:2px 9px 2px 3px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.autosw .knob{width:26px;height:15px;border-radius:999px;background:var(--line-strong);position:relative;transition:background .15s}
.autosw .knob::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:transform .15s}
.autosw.on{color:var(--good);border-color:var(--good)}
.autosw.on .knob{background:var(--good)}
.autosw.on .knob::after{transform:translateX(11px)}
.autosw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.autosw .knob,.autosw .knob::after{transition:none}}
.charbtn.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.charbtn:disabled{opacity:.35;cursor:not-allowed}
.ctr-turn{display:flex;align-items:center;gap:8px}
#railL{grid-area:left}#railR{grid-area:right}
@media (max-width:1150px){.layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"board board" "left right";grid-template-rows:auto}}
@media (max-width:700px){.layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"board" "left" "right"}}
.handcard .hand-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;overflow:visible;padding:2px 0 0}
.handcard .hcard{width:auto}
.handcard .set-gap{display:none}
.hand{grid-area:hand;width:min(100%,880px);justify-self:center;align-self:start;display:flex;flex-direction:column;gap:8px;min-width:0}
.hand-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hand-row{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 12px;scroll-snap-type:x proximity}
.hcard{flex:none;width:132px;border:1.5px solid var(--line-strong);border-radius:9px;background:var(--surface);display:flex;flex-direction:column;cursor:pointer;padding:0;text-align:left;overflow:hidden;scroll-snap-align:start;box-shadow:0 2px 6px rgba(0,0,0,.1);transition:transform .15s ease}
.hcard:hover{transform:translateY(-4px)}
.hcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.hcard .hb{padding:8px 9px;font-weight:700;font-size:13.5px;line-height:1.15;min-height:48px;display:flex;align-items:flex-end;text-wrap:balance}
.hcard .hbody{padding:8px 9px 10px;display:flex;flex-direction:column;gap:3px;font-size:12px}
.hcard .rent{font-family:var(--f-mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.hcard .pips{display:flex;gap:2px;margin:2px 0}
.hcard .house{width:10px;height:10px}.hcard .hotel{width:20px;height:10px}
.hcard.mort{opacity:.62}
.hcard.mort .hb{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,255,255,.28) 6px 9px)}
.set-gap{flex:none;width:8px}
@media (prefers-reduced-motion:reduce){.hcard{transition:none}.hcard:hover{transform:none}}
.stage{grid-area:board;display:flex;justify-content:center;min-width:0}
/* Fit mode: on laptop and desktop screens the whole game fits the window, side panels scroll inside themselves */
@media (min-width:900px) and (min-height:560px){
  html,body{height:100%}
  body{display:flex;flex-direction:column;padding-block:10px;overflow:hidden;position:relative}
  .top{position:absolute;top:10px;left:max(16px,env(safe-area-inset-left,0px));width:262px;margin:0;flex-direction:column;align-items:flex-start;gap:6px;z-index:2}
  .brand{font-size:19px}.brand small{margin-top:2px}
  #railL{padding-top:74px}
  .layout{flex:1;min-height:0;width:100%;max-width:none;grid-template-columns:262px minmax(0,1fr) 262px;grid-template-rows:minmax(0,1fr);align-items:stretch;gap:10px 14px}
  .stage{min-height:0;container-type:size;align-items:flex-start}
  .boardwrap{width:min(100cqw,100cqh)}
  .rail{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 3px 6px 0;scrollbar-width:thin}
  .hand{width:100%;gap:4px}
  .hand-row{padding:3px 2px 5px}
  .hand-head .sub{font-size:10.5px}
  .hcard{width:104px}
  .hcard:hover{transform:translateY(-2px)}
  .hcard .hb{min-height:0;font-size:12px;padding:4px 7px}
  .hcard .hbody{padding:3px 7px 5px;gap:0;font-size:11px}
  .hcard .hbody>.muted:first-child{display:none}
  .hcard .rent{font-size:14px}
  .hcard .pips{margin:1px 0}
  .log{max-height:none}
}
@media (min-width:900px) and (max-width:1150px) and (min-height:560px){
  .top{position:static;width:100%;flex-direction:row;align-items:center;margin-bottom:8px;flex:none}
  #railL{padding-top:0}
  .layout{grid-template-columns:minmax(0,1fr) 270px;grid-template-areas:"board left" "board right";grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
}

/* Board */
.board{container-type:inline-size;display:grid;grid-template-columns:2.3fr repeat(9,1fr) 2.3fr;grid-template-rows:2.3fr repeat(9,1fr) 2.3fr;
  aspect-ratio:1;width:100%;max-width:100%;background:var(--board);border:2px solid var(--ink);border-radius:4px;overflow:hidden}
.cell{position:relative;display:flex;border:.5px solid var(--line-strong);font-size:clamp(7px,1.6cqi,13px);line-height:1.12;cursor:pointer;min-width:0;min-height:0;background:var(--board);padding:0}
.cell:hover{background:var(--center)}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;z-index:2}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent);z-index:1}
.side-b{flex-direction:column}.side-t{flex-direction:column-reverse}.side-l{flex-direction:row-reverse}.side-r{flex-direction:row}
.band{flex:0 0 22%;display:flex;align-items:center;justify-content:center;gap:1px;flex-wrap:wrap}
.side-l .band,.side-r .band{flex-basis:20%;flex-direction:column}
.house{width:.75em;height:.75em;background:#1f8f4e;border:1px solid #0b3d22}
.hotel{width:1.5em;height:.8em;background:#c2372a;border:1px solid #5a120c}
.lbl{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1px 2px;gap:1px;min-width:0;min-height:0}
.nm{font-weight:600;overflow-wrap:anywhere}
.pr{font-family:var(--f-mono);color:var(--muted);font-size:.92em}
.tag{font-size:.82em;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cell.owned::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 .32em var(--own);pointer-events:none;opacity:.85}
.cell.mort .lbl{opacity:.4;text-decoration:line-through}
.corner .lbl{gap:.3em}
.corner .big{font-family:var(--f-display);font-size:1.7em;line-height:.95;text-wrap:balance}
.corner .tag{color:inherit;opacity:.85;font-weight:700}
.cell.corner:hover{filter:brightness(1.08)}
/* GO: green road sign */
.cell.c0{background:linear-gradient(140deg,#35a86c,#1c6b42);color:#fff}
.cell.c0 .big{font-family:"Bungee",var(--f-display);font-size:2.9em;text-shadow:0 .08em 0 rgba(0,0,0,.28)}
.cell.c0 .arrow{font-family:"Bungee",var(--f-display);font-size:1.9em;line-height:.7;color:#ffe08a}
/* JAIL: orange cell behind bars */
.cell.c10{background-color:#f0a43c;color:#1d1307;background-image:repeating-linear-gradient(90deg,transparent 0 13%,rgba(29,19,7,.28) 13% 16%)}
.cell.c10 .big{font-family:"Black Ops One",var(--f-display);font-size:1.2em;line-height:1.05;text-align:center;background:#f0a43c;padding:.05em .25em;border:2px solid #1d1307;border-radius:3px}
.cell.c10{background-color:#fbe6c4;background-image:none}
.jailbox{position:absolute;top:0;right:0;width:68%;height:68%;background-color:#f0a43c;background-image:repeating-linear-gradient(90deg,transparent 0 13%,rgba(29,19,7,.3) 13% 17%);border-left:3px solid #1d1307;border-bottom:3px solid #1d1307;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em;padding:.2em}
.visit-txt{position:absolute;left:0;right:0;bottom:0;height:32%;display:flex;align-items:center;justify-content:center;font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:.95em;color:#1d1307}
.vtoks{position:absolute;left:0;top:0;width:32%;height:68%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;pointer-events:none}
.jtoks{display:flex;flex-wrap:wrap;justify-content:center;pointer-events:none}
.jtoks .tok+.tok{margin-left:calc(clamp(18px,3.6cqi,34px) * -.32)}
.vtoks .tok+.tok{margin-top:calc(clamp(18px,3.6cqi,34px) * -.4)}
/* SNOW DAY: icy blue with falling snow */
.cell.c20{background:radial-gradient(circle,#fff 0 1.6px,transparent 2.4px) 0 0/18px 18px,radial-gradient(circle,rgba(255,255,255,.75) 0 1.2px,transparent 2px) 9px 9px/18px 18px,linear-gradient(180deg,#d4eefb,#a9d6f0);color:#123a5c}
.cell.c20 .pot{font-family:var(--f-mono);font-weight:700;font-size:1.35em;background:#fff;color:#1d4fb8;border-radius:999px;padding:.05em .55em;box-shadow:0 1px 3px rgba(18,58,92,.3)}
.cell.c20 .big{font-family:"Chewy",var(--f-display);font-size:2.5em;color:#1d4fb8;text-shadow:0 0 .2em #fff,0 0 .2em #fff;line-height:.95}
/* GO TO JAIL: red comic stamp */
.cell.c30{background:radial-gradient(circle at 50% 50%,#d9483a,#a42b20);color:#fff}
.cell.c30 .big{font-family:"Bangers",var(--f-display);font-size:2.1em;letter-spacing:.04em;transform:rotate(-9deg);text-shadow:.06em .06em 0 #4e0f09}
.tokens{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;pointer-events:none;z-index:3;padding:2px}
.tok{width:clamp(18px,3.6cqi,34px);height:clamp(18px,3.6cqi,34px);border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:clamp(10px,1.9cqi,17px);border:2px solid var(--surface);box-shadow:0 2px 5px rgba(0,0,0,.45);flex:none}
.tokens .tok+.tok{margin-left:calc(clamp(18px,3.6cqi,34px) * -.32)}
.tokens .tok.me{outline:2.5px solid var(--ink);outline-offset:1px}
.pl .tok,.ctr-turn .tok,.charbtn .tok{width:32px;height:32px;font-size:14px}
.center{grid-row:2/11;grid-column:2/11;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow:auto;gap:1.1cqi;background:var(--center);
  border:.5px solid var(--line-strong);padding:1.6cqi;text-align:center;
  background-image:repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in srgb,var(--board) 45%,transparent) 14px 15px)}
.wordmark{font-family:var(--f-display);font-size:3.6cqi;line-height:1;text-align:center;text-wrap:balance;flex:none;margin-top:.6cqi}
.wordmark span{color:var(--accent)}
.dice{display:flex;gap:2.4cqi}
.die{width:7cqi;height:7cqi;background:var(--surface);border:1.5px solid var(--ink);border-radius:18%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:1.2cqi}
.die i{display:block;border-radius:50%}
.die i.on{background:var(--ink)}
.die.roll{animation:tumble .5s ease-out}
@keyframes tumble{0%{transform:rotate(-200deg) scale(.6)}70%{transform:rotate(15deg) scale(1.05)}100%{transform:none}}
.ctr-turn{font-size:clamp(11px,2.1cqi,16px);font-weight:600}
.ctr-card{max-width:52cqi;font-size:clamp(10px,1.65cqi,12.5px);line-height:1.3;background:var(--surface);border:1px dashed var(--line-strong);padding:.7cqi 1.4cqi;border-radius:6px;flex:none}
.ctr-card b{display:inline;margin-right:.4em;font-size:.8em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.2em}
@media (prefers-reduced-motion:reduce){.die.roll{animation:none}}
.center .card{width:min(100%,54cqi);padding:1.6cqi 2cqi;gap:1.3cqi;font-size:clamp(11px,2.3cqi,15px);text-align:left;box-shadow:0 2px 10px rgba(0,0,0,.12);flex:none}
.center .card h2{font-size:clamp(9px,1.7cqi,12px)}
.center .card h3{font-size:clamp(13px,2.8cqi,19px)}
.center .card p.muted{font-size:.88em;line-height:1.3}
.center .btn{padding:clamp(6px,1.3cqi,10px) clamp(9px,2.2cqi,16px)}
.center .btn.primary{font-size:1.08em}
.center .warn,.center .note{padding:1cqi 1.4cqi}
@container (max-width:560px){.center .wordmark{display:none}.center .ctr-card{font-size:10px}}

/* Rail */
.rail{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{margin:0;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card h3{margin:0;font-size:20px;line-height:1.2;text-wrap:balance}
.card p{margin:0}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--signal);border-color:color-mix(in srgb,var(--signal) 50%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],select{border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0}
input[type=text]{flex:1}
.money{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.neg{color:var(--signal)}
.players{display:flex;flex-direction:column;gap:6px}
.pl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;border:1px solid transparent}
.pl.now{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.pl.out{opacity:.45}
.pl .who{min-width:0}
.pl .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .who small{color:var(--muted);font-size:12px}
.pill{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid currentColor}
.pill.jail{color:var(--signal)}.pill.you{color:var(--accent)}.pill.host{color:var(--muted)}
.warn{border-left:3px solid var(--signal);padding:8px 10px;background:color-mix(in srgb,var(--signal) 9%,transparent);border-radius:0 8px 8px 0}
.note{border-left:3px solid var(--accent);padding:8px 10px;background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:0 8px 8px 0}
.deed-band{height:10px;border-radius:4px}
table.rent{width:100%;border-collapse:collapse;font-size:14px}
table.rent td{padding:3px 0;border-bottom:1px solid var(--line)}
table.rent td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.rent tr.hl td{font-weight:700;color:var(--accent)}
.games{display:flex;flex-direction:column;gap:8px}

.partner .tok,.ohead .tok{width:28px;height:28px;font-size:13px}

const CHARS={

 plow:{n:'Plow',d:'<rect x="2.5" y="10" width="12" height="5.5" rx="1"/><path d="M7.5 10l1.6-4h4.5l1.4 4z"/><rect x="14" y="12" width="3" height="3.5"/><path d="M17.5 8.5c1.5.5 3 .5 4 0v9c-1 .5-2.5.5-4 0z"/><circle cx="6" cy="17" r="2.2"/><circle cx="12" cy="17" r="2.2"/>'},
 snowman:{n:'Snowman',d:'<circle cx="12" cy="6.8" r="3.4"/><circle cx="12" cy="15.6" r="5.8"/><path d="M8.6 3.6h6.8v1.3H8.6zM10 .9h4v3h-4z"/>'},
 boat:{n:'Sailboat',d:'<path d="M11 2.5v12.5H4.5z"/><path d="M12.6 5v10h6z"/><path d="M3 16.5h18l-2.8 4H5.8z"/>'},
 lighthouse:{n:'Lighthouse',d:'<path d="M10.8 1.5h2.4v1.8h-2.4z"/><path d="M9.5 3.8h5l.8 3.4H8.7z"/><path d="M9.2 8.2h5.6L16.3 20H7.7z"/><rect x="5.5" y="20" width="13" height="2.3" rx=".6"/>'},
 hockey:{n:'Hockey',d:'<path d="M14.6 2.5l2.4 1.1-6.1 13.8c-.5 1.2-1.7 2-3 2H3.5v-3.2h4.6z"/><ellipse cx="17.5" cy="18.6" rx="3.6" ry="1.9"/>'},
 mitten:{n:'Mitten',d:'<path d="M8.5 22v-3.4C6 16.8 4.5 14 4.5 10.9 4.5 7 7.3 3.5 11 3.5s6 2.9 6 6.4v1.3l1.4-1.6a2 2 0 0 1 3 2.6l-4 4.9V22z"/>'},
};
const charSVG=k=>CHARS[k]?`<svg viewBox="0 0 24 24" aria-hidden="true">${CHARS[k].d}</svg>`:'';
function tokHTML(p){const c=CHARS[p.char];return `<span class="tok${p.id===myId?' me':''}" style="background:${p.color}" title="${esc(p.name)}${c?' · '+c.n:''}">${c?charSVG(p.char):esc(p.name[0]?.toUpperCase())}</span>`}
function charPicker(taken=[]){return `<p class="muted" style="font-size:13px">Pick your character</p><div class="chars" role="radiogroup" aria-label="Choose your character">${Object.entries(CHARS).map(([k,c])=>`<button class="charbtn${myChar===k?' on':''}" data-act="pickChar" data-c="${k}" role="radio" aria-checked="${myChar===k}"${taken.includes(k)?' disabled':''}><span class="tok" style="background:#3d5a78">${charSVG(k)}</span><small>${c.n}</small></button>`).join('')}</div>`}
const TOKENS=['#d1495b','#2e7fb0','#d98e1f','#2f9a62','#8a59c2','#d0603f'];
const CHANCE=[
 {x:'Advance to GO and collect your GO money.',op:'move',to:0},
 {x:'Field trip from Alden High School. Advance to Niagara Falls.',op:'move',to:34},
 {x:'Drive in from Crittenden Rd for dinner. Advance to Elmwood Ave.',op:'move',to:11},
 {x:'Cruise down Broadway all the way to the lake. Advance to Lake Erie Shore.',op:'move',to:39},
 {x:'Catch a train at the Alden Depot. Advance to Metro Rail.',op:'move',to:5},
 {x:'Advance to the nearest transit stop. If owned, pay double rent.',op:'transit'},
 {x:'Bank pays you a dividend of $50.',op:'cash',amt:50},
 {x:"Hall pass: get out of Michael's House free. Keep it until needed.",op:'goojf'},
 {x:'Whiteout on Route 20. Go back 3 spaces.',op:'back'},
 {x:"Caught skipping class. Go straight to Michael's House.",op:'jail'},
 {x:'Ice dams on every roof. Pay $25 per house and $100 per hotel.',op:'repairs',h:25,ho:100},
 {x:'Speeding on Walden Ave. Pay $15.',op:'cash',amt:-15},
 {x:'Elected block club president. Pay each player $50.',op:'eachPay',amt:50},
 {x:'Your building loan matures. Collect $150.',op:'cash',amt:150},
];
const CHEST=[
 {x:'Advance to GO and collect your GO money.',op:'move',to:0},
 {x:'Snowplow damage refund. Collect $200.',op:'cash',amt:200},
 {x:'Car stuck in a snowbank. Pay $50 for the tow.',op:'cash',amt:-50},
 {x:'Your fish fry fundraiser earns $50.',op:'cash',amt:50},
 {x:"Hall pass: get out of Michael's House free. Keep it until needed.",op:'goojf'},
 {x:"No snow day after all. Go straight to Michael's House.",op:'jail'},
 {x:'Holiday savings club pays out. Collect $100.',op:'cash',amt:100},
 {x:'Tax refund. Collect $20.',op:'cash',amt:20},
 {x:'It is your birthday. Collect $10 from each player.',op:'eachGet',amt:10},
 {x:'Furnace quits in January. Pay $100.',op:'cash',amt:-100},
 {x:'Hockey camp fees. Pay $50.',op:'cash',amt:-50},
 {x:'Pothole repairs. Pay $40 per house and $115 per hotel.',op:'repairs',h:40,ho:115},
 {x:'You win the wing eating contest. Collect $10.',op:'cash',amt:10},
 {x:'You inherit $100.',op:'cash',amt:100},
];
const isBuy=t=>t==='prop'||t==='transit'||t==='util';
const gIdx=g=>SP.map((s,i)=>s.g===g?i:-1).filter(i=>i>=0);
const money=n=>(n<0?'-$':'$')+Math.abs(n).toLocaleString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const usesLabel=u=>u<0?'rest of game':`${u} landing${u>1?'s':''}`;

/* ---------- Rules ---------- */
const P=(s,id)=>s.players.find(p=>p.id===id);
const cur=s=>s.players[s.turn];
const alive=s=>s.players.filter(p=>!p.bankrupt);
function log(s,m){s.log.unshift(m);if(s.log.length>60)s.log.length=60}
const ownerOf=(s,i)=>s.props[i]?.owner||null;
const ownsGroup=(s,id,g)=>gIdx(g).every(i=>ownerOf(s,i)===id);
const groupHasHouses=(s,g)=>gIdx(g).some(i=>(s.props[i]?.houses||0)>0);
const countType=(s,id,t)=>SP.reduce((a,x,j)=>a+(x.t===t&&ownerOf(s,j)===id?1:0),0);
function rentFor(s,i,sum){
  const sp=SP[i],pr=s.props[i]; if(!pr||pr.mortgaged)return 0;
  if(sp.t==='prop')return pr.houses>0?sp.r[pr.houses]:sp.r[0]*(ownsGroup(s,pr.owner,sp.g)?2:1);
  if(sp.t==='transit')return 25*2**(countType(s,pr.owner,'transit')-1);
  if(sp.t==='util')return (countType(s,pr.owner,'util')===2?10:4)*sum;
  return 0;
}
function pay(s,from,toId,amt){
  from.cash-=amt; const to=toId?P(s,toId):null; if(to)to.cash+=amt;
  if(from.cash<0)from.owesTo=to?to.id:'bank';
}
function settle(p){if(p.cash>=0)p.owesTo=null}
function sendJail(s,p){p.pos=10;p.inJail=true;p.jailTurns=0;s.canRollAgain=false;s.doublesCount=0;log(s,`${p.name} got sent to Michael's House.`)}
const goPay=landed=>landed?400:200;
const POT_START=500,potOf=s=>s?.pot??POT_START;
function checkAllSold(s){}
function passGo(s,p,landed){const g=goPay(landed);p.cash+=g;settle(p);log(s,`${p.name} ${landed?'landed on':'passed'} GO and collected ${money(g)}.`)}
function advanceTo(s,p,to){if(to<p.pos)passGo(s,p,to===0);p.pos=to}
function land(s,p,sum,mult=1){
  const i=p.pos,sp=SP[i];
  s.phase='end';
  if(isBuy(sp.t)){
    const pr=s.props[i];
    if(!pr){s.phase='buy';log(s,`${p.name} landed on ${sp.n}.`)}
    else if(pr.owner!==p.id){
      const o=P(s,pr.owner);
      if(pr.mortgaged)log(s,`${p.name} landed on ${sp.n}. It is mortgaged, so no rent.`);
      else if(o&&!o.bankrupt){
        const im=(s.immunity||[]).find(x=>x.prop===i&&x.holder===p.id&&x.grantor===o.id);
        if(im){if(im.left>0)im.left--;const left=im.left;s.immunity=s.immunity.filter(x=>x.left!==0);
          log(s,`${p.name} used rent immunity on ${sp.n}${left>0?` (${left} left)`:left===0?' (used up)':''}.`)}
        else{const r=rentFor(s,i,sum)*mult;pay(s,p,o.id,r);log(s,`${p.name} paid ${money(r)} rent to ${o.name} for ${sp.n}${mult>1?` (double rent from the card, normally ${money(r/mult)})`:''}.`)}}
    }
  }else if(sp.t==='tax'){pay(s,p,null,sp.amt);s.pot=potOf(s)+sp.amt;log(s,`${p.name} paid ${money(sp.amt)} for the ${sp.n}. The Snow Day pot is now ${money(s.pot)}.`)}
  else if(sp.t==='free'){const g=potOf(s);p.cash+=g;settle(p);s.pot=POT_START;log(s,`${p.name} landed on Snow Day and collected the ${money(g)} pot!`)}
  else if(sp.t==='chance'||sp.t==='chest')drawCard(s,p,sp.t,sum);
  else if(sp.t==='gotojail')sendJail(s,p);
}
function drawCard(s,p,deck,sum){
  const list=deck==='chance'?CHANCE:CHEST,c=list[Math.floor(Math.random()*list.length)];
  s.lastCard={deck:deck==='chance'?'Lake Effect':'Neighborhood',text:c.x,by:p.name};
  log(s,`${p.name} drew ${deck==='chance'?'Lake Effect':'Neighborhood'}: ${c.x}`);
  s.phase='end';
  switch(c.op){
    case 'cash': if(c.amt>0){p.cash+=c.amt;settle(p)}else pay(s,p,null,-c.amt);break;
    case 'move': advanceTo(s,p,c.to);land(s,p,sum);break;
    case 'goojf': p.goojf=(p.goojf||0)+1;break;
    case 'jail': sendJail(s,p);break;
    case 'back': p.pos=(p.pos+37)%40;land(s,p,sum);break;
    case 'transit':{let j=p.pos;do{j=(j+1)%40}while(SP[j].t!=='transit');advanceTo(s,p,j);land(s,p,sum,2);break}
    case 'repairs':{let h=0,ho=0;for(const k in s.props){const pr=s.props[k];if(pr.owner===p.id){if(pr.houses===5)ho++;else h+=pr.houses}}
      const amt=h*c.h+ho*c.ho;if(amt)pay(s,p,null,amt);break}
    case 'eachPay': for(const o of alive(s))if(o.id!==p.id)pay(s,p,o.id,c.amt);break;
    case 'eachGet': for(const o of alive(s))if(o.id!==p.id)pay(s,o,p.id,c.amt);settle(p);break;
  }
}
function finish(s){if(s.phase!=='buy')s.phase=s.canRollAgain?'roll':'end'}
function move(s,p,steps,sum){const np=p.pos+steps;if(np>=40)passGo(s,p,np%40===0);p.pos=np%40;land(s,p,sum)}
function nextTurn(s){
  if(alive(s).length<2)return;
  let n=s.turn;do{n=(n+1)%s.players.length}while(s.players[n].bankrupt);
  s.turn=n;s.phase='roll';s.doublesCount=0;s.canRollAgain=false;
  log(s,`${s.players[n].name}'s turn.`);
}
function bankrupt(s,p,reason){
  const cred=p.owesTo&&p.owesTo!=='bank'?P(s,p.owesTo):null;
  for(const k in s.props){const pr=s.props[k];if(pr.owner!==p.id)continue;
    if(pr.houses){p.cash+=pr.houses*HC[SP[k].g]/2;pr.houses=0}
    if(cred&&!cred.bankrupt)pr.owner=cred.id;else delete s.props[k];}
  if(cred&&!cred.bankrupt){cred.cash+=Math.min(p.cash,0);cred.goojf=(cred.goojf||0)+(p.goojf||0);settle(cred)}
  log(s,`${p.name} ${reason||'went bankrupt'}${cred?` and handed everything to ${cred.name}`:''}.`);
  const wasTurn=cur(s)?.id===p.id;
  p.bankrupt=true;p.cash=0;p.owesTo=null;p.goojf=0;p.inJail=false;
  s.trades=getTrades(s).filter(t=>t.from!==p.id&&t.to!==p.id);s.trade=null;
  s.immunity=(s.immunity||[]).filter(x=>x.holder!==p.id&&x.grantor!==p.id);
  const left=alive(s);
  if(left.length===1){s.status='over';s.winner=left[0].id;log(s,`${left[0].name} wins The Skreets of Maple Ridge!`)}
  else if(wasTurn)nextTurn(s);
}

  try{
    let got=false;

    else if(sp.g){const gs=gIdx(sp.g),n=gs.filter(j=>ownerOf(s,j)===myId).length;status=n===gs.length?'<span style="color:var(--good);font-weight:700">Full set</span>':`${n} of ${gs.length} in set`}
    else status=sp.t==='transit'?`${countType(s,myId,'transit')} of 4 stops`:`${countType(s,myId,'util')} of 2 utilities`;
    const h=pr.houses||0,pips=h===5?'<span class="hotel"></span>':'<span class="house"></span>'.repeat(h);
    const imm=(s.immunity||[]).filter(x=>x.prop===i&&x.grantor===myId).length;
    cards+=`<button class="hcard${pr.mortgaged?' mort':''}${selected===i?' sel':''}" data-act="select" data-i="${i}" aria-label="${esc(sp.n)}"><span class="hb" style="background:${bg};color:${ink}">${esc(sp.n)}</span><span class="hbody"><span class="muted">Rent now</span><span class="rent">${rent}</span>${h?`<span class="pips">${pips}</span>`:''}<span>${status}</span>${imm?`<span class="muted">Free rent given · ${imm}</span>`:''}</span></button>`;
  }
  return `<div class="hand-head"><h2 class="sub" style="margin:0">Your properties · ${mine.length}</h2><span class="muted" style="font-size:13px">Net worth <span class="money" style="color:var(--ink)">${money(worth)}</span></span></div>${mine.length?`<div class="hand-row">${cards}</div>`:`<p class="muted" style="margin:0">You don't own anything yet. Land on an open space and buy it.</p>`}`;
}
function tradeModal(s){
  const me=P(s,myId),them=P(s,tradeDraft.to);if(!me||!them||them.bankrupt||me.bankrupt)return '';
  const d=tradeDraft,dis=busy?' disabled':'',others=alive(s).filter(p=>p.id!==myId);
  const owned=id=>Object.keys(s.props).map(Number).filter(i=>s.props[i].owner===id).sort((a,b)=>a-b);
  const side=(who,key,immKey,cashKey,label,immLabel)=>{
    const props=owned(who.id);
    const chips=props.length?props.map(i=>{const pr=s.props[i],ok=tradeable(s,i),on=d[key].includes(i);
      const meta=pr.mortgaged?'mortgaged':pr.houses?`${money(SP[i].p)} + ${bldLabel(pr.houses)}`:money(SP[i].p);
      const keepKey=key==='give'?'getImm':'giveImm',kOn=d[keepKey].includes(i);
      const keep=on?`<button class="tchip sm keep${kOn?' on':''}" data-act="tglImm" data-side="${keepKey}" data-i="${i}" aria-pressed="${kOn}"><span class="tn">${key==='give'?'Keep free rent here for me':`${esc(who.name)} keeps free rent here`}</span><span class="ck">${kOn?'✓':''}</span></button>`:'';
      return `<button class="tchip${on?' on':''}" data-act="tglProp" data-side="${key}" data-i="${i}" aria-pressed="${on}"${ok?'':' disabled'}><span class="sw" style="background:${swatch(i)}"></span><span class="tn">${esc(SP[i].n)}</span><span class="meta">${meta}</span><span class="ck">${on?'✓':''}</span></button>${keep}`}).join(''):'<p class="muted" style="font-size:13px">No properties</p>';
    const incoming=d[key==='give'?'get':'give'];
    const stay=props.filter(i=>!d[key].includes(i));
    const imm=stay.length?stay.map(i=>{const on=d[immKey].includes(i),traded=incoming.includes(i);return `<button class="tchip sm${on?' on':''}" data-act="tglImm" data-side="${immKey}" data-i="${i}" aria-pressed="${on}"><span class="sw" style="background:${swatch(i)}"></span><span class="tn">${esc(SP[i].n)}</span><span class="meta">${traded?'in this trade':`rent ${money(SP[i].r?SP[i].r[s.props[i].houses||0]:SP[i].t==='transit'?25:0)}${SP[i].t==='util'?'×':''}`}</span><span class="ck">${on?'✓':''}</span></button>`}).join(''):'<p class="muted" style="font-size:13px">No properties to offer</p>';
    const c=+d[cashKey]||0;
    return `<div class="tside" style="--side:${who.color}"><div class="ohead">${tokHTML(who)}<b>${label}</b><span class="meta money">${money(who.cash)} on hand</span></div>
      <div><div class="sub">Cash</div><div class="stepper"><button class="btn sm" data-act="cashStep" data-side="${cashKey}" data-d="-50" aria-label="50 less">−50</button><input type="number" id="${cashKey}" min="0" step="10" value="${c}" aria-label="${label} cash"><button class="btn sm" data-act="cashStep" data-side="${cashKey}" data-d="50" aria-label="50 more">+50</button></div>${c>0&&c>who.cash?`<p class="neg" style="font-size:13px;margin-top:6px">${esc(who.name)} only has ${money(who.cash)}.</p>`:''}</div>
      <div><div class="sub">Properties</div><div class="tlist">${chips}</div></div>
      <div><div class="sub">${immLabel}</div><div class="tlist">${imm}</div></div></div>`;
  };
  const giveV=d.give.reduce((a,i)=>a+tradeVal(s,i),0)+(+d.giveCash||0),getV=d.get.reduce((a,i)=>a+tradeVal(s,i),0)+(+d.getCash||0);
  const empty=!d.give.length&&!d.get.length&&!(+d.giveCash)&&!(+d.getCash)&&!d.giveImm.length&&!d.getImm.length;
  const over=((+d.giveCash||0)>0&&(+d.giveCash||0)>me.cash)||((+d.getCash||0)>0&&(+d.getCash||0)>them.cash),blocked=getTrades(s).length>=12,anyImm=d.giveImm.length||d.getImm.length,diff=getV-giveV;
  return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="tradeTitle"><div class="sheet">
    <div class="row" style="justify-content:space-between"><h3 id="tradeTitle" style="margin:0;font-size:22px">Trade with ${esc(them.name)}</h3><button class="btn sm" data-act="closeTrade">Close</button></div>
    ${others.length>1?`<div class="row">${others.map(p=>`<button class="btn sm partner${p.id===them.id?' sel':''}" data-act="openTrade" data-id="${esc(p.id)}">${tokHTML(p)}${esc(p.name)}</button>`).join('')}</div>`:''}
    <div class="tcols">${side(me,'give','giveImm','giveCash','You give','Free rent for them on')}${side(them,'get','getImm','getCash','You get','Free rent for you on')}</div>
    ${anyImm?`<div class="row"><span class="sub" style="margin:0">Free rent lasts</span><div class="seg">${[1,2,3,-1].map(u=>`<button data-act="setUses" data-u="${u}" class="${+d.uses===u?'on':''}">${usesLabel(u)}</button>`).join('')}</div></div>`:''}
    <div class="tsum"><div><div class="sub" style="margin-bottom:2px">Deal value at list price</div><span class="money">${money(giveV)}</span> <span class="muted">out</span> · <span class="money">${money(getV)}</span> <span class="muted">in</span>${giveV||getV?` <span class="pill" style="color:${diff>=0?'var(--good)':'var(--signal)'}">${diff>=0?'+':'−'}${money(Math.abs(diff))} for you</span>`:''}</div>
    <div class="row">${blocked?'<span class="muted" style="font-size:13px">Too many open trades. Wait for some to finish.</span>':''}<button class="btn" data-act="clearTrade">Clear</button><button class="btn primary" data-act="propose"${dis||(empty||over||blocked?' disabled':'')}>Send offer</button></div></div>
  </div></div>`;
}
function tradeCardOld(s){
  const me=P(s,myId);if(s.status!=='active'||!me||me.bankrupt)return '';
  const name=i=>esc(SP[i].n),list=(arr,c,imm,u)=>[...arr.map(name),c?money(c):'',imm?.length?`free rent on ${imm.map(name).join(', ')} (${usesLabel(u||1)})`:''].filter(Boolean).join(', ')||'nothing';
  const t=s.trade,dis=busy?' disabled':'';
  if(t){const a=P(s,t.from),b=P(s,t.to);
    let out=`<section class="card"><h2>Trade offer</h2><p><b>${esc(a.name)}</b> gives ${list(t.give,t.giveCash,t.giveImm,t.uses)}.</p><p><b>${esc(b.name)}</b> gives ${list(t.get,t.getCash,t.getImm,t.uses)}.</p>`;
    if(t.to===myId)out+=`<div class="row"><button class="btn primary" data-act="accept"${dis}>Accept</button><button class="btn" data-act="decline"${dis}>Decline</button></div>`;
    else if(t.from===myId)out+=`<div class="row"><span class="muted">Waiting for ${esc(b.name)}.</span><button class="btn sm" data-act="decline"${dis}>Withdraw</button></div>`;
    return out+'</section>'}
  const others=alive(s).filter(p=>p.id!==myId);if(!others.length)return '';
  if(!others.some(p=>p.id===tradeDraft.to))tradeDraft.to=others[0].id;
  const mineP=Object.keys(s.props).map(Number).filter(i=>s.props[i].owner===myId&&tradeable(s,i)),theirs=Object.keys(s.props).map(Number).filter(i=>s.props[i].owner===tradeDraft.to&&tradeable(s,i));
  const myAll=Object.keys(s.props).map(Number).filter(i=>s.props[i].owner===myId),theirAll=Object.keys(s.props).map(Number).filter(i=>s.props[i].owner===tradeDraft.to);
  const box=(arr,key)=>arr.length?`<div class="checks">${arr.map(i=>`<label><input type="checkbox" id="t-${key}-${i}" data-trade="${key}" value="${i}"${tradeDraft[key].includes(i)?' checked':''}><span class="sw" style="background:${SP[i].g?`var(--g-${SP[i].g})`:'var(--line-strong)'}"></span>${name(i)}</label>`).join('')}</div>`:'<p class="muted" style="font-size:13px">None</p>';
  return `<section class="card"><details${tradeDraft.open?' open':''} id="tradeDetails"><summary>Offer a trade</summary>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
    <div class="row"><label for="tradeTo" class="muted">With</label><select id="tradeTo">${others.map(p=>`<option value="${esc(p.id)}"${p.id===tradeDraft.to?' selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
    <div class="cols"><div><b style="font-size:13px">You give</b>${box(mineP,'give')}<input type="number" id="giveCash" min="0" step="10" placeholder="Cash" value="${tradeDraft.giveCash||''}" style="width:100%;margin-top:6px"><b style="font-size:13px;display:block;margin-top:10px">Free rent for them on</b>${box(myAll,'giveImm')}</div>
    <div><b style="font-size:13px">You get</b>${box(theirs,'get')}<input type="number" id="getCash" min="0" step="10" placeholder="Cash" value="${tradeDraft.getCash||''}" style="width:100%;margin-top:6px"><b style="font-size:13px;display:block;margin-top:10px">Free rent for you on</b>${box(theirAll,'getImm')}</div></div>
    <div class="row"><label for="tradeUses" class="muted">Free rent lasts</label><select id="tradeUses">${[1,2,3,-1].map(u=>`<option value="${u}"${+tradeDraft.uses===u?' selected':''}>${usesLabel(u)}</option>`).join('')}</select></div>
    <div class="row"><button class="btn primary" data-act="propose"${dis}>Send offer</button></div></div></details></section>`;

function homeCards(){
  if(!ready)return `<section class="card"><h2>Loading</h2><p class="muted">Connecting to the game server…</p></section>`;
  if(!db)return `<section class="card"><h2>Can't connect</h2><p>Could not reach the game server. Make sure <code>npm start</code> is running, then reload.</p></section>`;
  const list=games.filter(g=>g.status==='active');
  let out=`<section class="card"><h2>New table</h2><h3>Start a game</h3>`;
  out+=canWrite===false?`<p class="note">Your access is view-only, so you can watch games but not play. Ask the person who shared this page for edit access.</p>`
    :`<div class="row"><input type="text" id="nameIn" maxlength="18" placeholder="Your name" value="${esc(myName)}" aria-label="Your name"><button class="btn primary" data-act="create"${busy?' disabled':''}>Create</button></div>${charPicker()}`;
  out+=`<div class="row"><input type="text" id="codeIn" maxlength="4" placeholder="Have a code? e.g. K7QX" aria-label="Game code" style="text-transform:uppercase"><button class="btn" data-act="open">Open</button></div></section>`;
  out+=`<section class="card"><h2>Games in progress</h2>${list.length?`<div class="games">${list.map(g=>`<div class="game"><span class="code">${esc(g.code)}</span><div style="min-width:0"><b>${g.players.filter(p=>!p.bankrupt).length} players left</b><small>${esc(g.players.map(p=>p.name).join(', '))}</small></div><button class="btn sm" data-act="open" data-code="${esc(g.code)}">${g.players.some(p=>p.id===myId&&!p.bankrupt)?'Rejoin':'Watch'}</button></div>`).join('')}</div>`
    :`<p class="muted">No games are being played right now. Start one, or join a friend's table with its 4-letter code.</p>`}</section>`;
  out+=`<section class="card"><details><summary>How it plays</summary><ul>
    <li>Everyone starts with $1,500. Roll, move, and buy the Buffalo spots you land on.</li>
    <li>Own a full color set to double its rent and build houses, then a hotel.</li>
    <li>Doubles roll again. Three doubles in a row sends you to Michael's House.</li>
    <li>Trade properties and cash with other players at any time.</li>
    <li>Run out of money and you are out. Last player standing wins.</li></ul></details></section>`;
  return out;
}
function trackMoves(){
  const s=state;if(!s||s.status==='lobby'){prevPos={};prevGame=s?.code??null;return}
  if(prevGame!==s.code){prevGame=s.code;prevPos={}}
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  for(const p of s.players){const old=prevPos[p.id];prevPos[p.id]=p.pos;
    if(old===undefined||old===p.pos||p.bankrupt||reduce||animating.has(p.id))continue;
    animateMove(p,old,p.pos)}
}
async function animateMove(p,from,to){
  animating.add(p.id);
  const wrap=$('#boardWrap'),fx=$('#fx'),el=document.createElement('div');el.className='fxtok';el.innerHTML=tokHTML(p);fx.appendChild(el);
  const center=i=>{const c=$('#board').querySelector(`[data-i="${i}"]`);if(!c)return[0,0];const a=c.getBoundingClientRect(),w=wrap.getBoundingClientRect();return[a.left-w.left+a.width/2,a.top-w.top+a.height/2]};
  try{
    await new Promise(r=>requestAnimationFrame(r));
    const d=(to-from+40)%40,path=d>0&&d<=12?Array.from({length:d},(_,k)=>(from+k+1)%40):[to],step=path.length>1;
    let [x,y]=center(from);el.style.transform=`translate(${x}px,${y}px)`;
    for(const i of path){
      const [nx,ny]=center(i),h=el.firstChild.offsetHeight||28,up=(step?-.85:-2.6)*h;
      await el.animate([
        {transform:`translate(${x}px,${y}px) scale(1,1)`},
        {transform:`translate(${(x+nx)/2}px,${(y+ny)/2+up}px) scale(1.1,1.1)`,offset:.5},
        {transform:`translate(${nx}px,${ny}px) scale(1.18,.8)`,offset:.86},
        {transform:`translate(${nx}px,${ny}px) scale(1,1)`}
      ],{duration:step?190:620,easing:'ease-in-out',fill:'forwards'}).finished;
      x=nx;y=ny;
    }
    await sleep(60);
  }catch(e){}
  el.remove();animating.delete(p.id);renderBoard();
}
function render(){
  trackMoves();
  renderBoard();
  scheduleBot();
  const top=$('#topRight');
  setHTML(top,state?`<span class="chip">Table ${esc(state.code)}</span>`:'');
  const home=!state||state.status==='lobby';
  document.body.classList.toggle('home-mode',home);
  $('#homeView').hidden=!home;$('#gameView').hidden=home;$('#topBar').hidden=home;
  if(home){putRail($('#homeView'),homePage());putRail($('#railL'),'');putRail($('#railR'),'');putRail($('#modal'),'');tradeOpen=false;return}
  let h;
  let r;
  {
    h=`<section class="card"><h2>Players</h2>${playerRows(state)}</section>`+tradeCard(state);
    const hh=handHTML(state);
    r=(hh?`<section class="card handcard">${hh}</section>`:'')+deedCard(state)+`<section class="card"><h2>Game log</h2><ol class="log">${state.log.slice(0,25).map(m=>`<li>${esc(m)}</li>`).join('')}</ol></section>`;
  }
  putRail($('#railR'),r);putRail($('#railL'),h);
  $('#hand').hidden=true;
  const mh=tradeOpen&&state?.status==='active'?tradeModal(state):'';
  if(!mh)tradeOpen=false;
  putRail($('#modal'),mh);document.body.style.overflow=mh?'hidden':'';
}
function homePage(){
  const bands=['brown','sky','plum','amber','red','gold','pine','navy'].map(g=>`<span style="background:var(--g-${g})"></span>`).join('');
  const s=state;
  const hero=s?`<p class="hero-kicker">Waiting room</p><div class="hero-mark">Table <span class="hero-code">${esc(s.code)}</span></div><p class="hero-sub">${s.players.length} of 6 players · share the code so friends can join</p>`
    :`<div class="hero-mark">The Skreets of <span>Maple Ridge</span></div><p class="hero-sub">Buffalo property trading for 2 to 6 players</p>`;
  const body=s?`<div class="home-grid">${lobbyCard(s)}<section class="card"><h2>Players</h2>${playerRows(s)}</section></div>`:`<div class="home-grid">${homeCards()}</div>`;
  return `<div class="home-inner"><header class="hero">${hero}<div class="bands" aria-hidden="true">${bands}</div></header>${body}</div>`;
}
function putRail(rail,h){
  if(rail._h!==h){const f=document.activeElement?.id;rail.innerHTML=h;rail._h=h;if(f){const el=document.getElementById(f);if(el){el.focus();if(el.type==='text'||el.type==='number'){try{const v=el.value;el.setSelectionRange?.(v.length,v.length)}catch(e){}}}}}
}

function openGame(code){
  if(unsubGame)unsubGame();
  selected=null;confirmKey=null;lastRoll=null;
  gameRef=db.doc('games/'+code);rememberGame(code);
  state=null;render();
  unsubGame=gameRef.onSnapshot(snap=>{
    if(!snap.exists){if(!snap.metadata.fromCache){toast(`No table with code ${code}.`);A.leaveView()}return}
    state=snap.data();render();
  },e=>{toast('Lost connection to the table. Reopen it to continue.')});
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  if(e.target.classList?.contains('modal')){A.closeTrade();return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;if(act!=='bankrupt'&&act!=='resign'&&act!=='remove'&&confirmKey){confirmKey=null}
  if(act==='select')return A.select(el.dataset.i);
  if(act==='pickChar')return A.pickChar(el.dataset.c);
  if(act==='tglProp'||act==='tglImm')return A[act](el.dataset.side,+el.dataset.i);
  if(act==='cashStep')return A.cashStep(el.dataset.side,+el.dataset.d);
  if(act==='openTrade')return A.openTrade(el.dataset.id);
  if(el.dataset.tid)return A[act](el.dataset.tid);
  if(act==='setUses')return A.setUses(+el.dataset.u);
  if(act==='open')return A.open(el.dataset.code);
  if(act==='remove')return A.remove(el.dataset.id);
  if(act==='toggleAuto')return A.toggleAuto(el.dataset.id);
  if(el.dataset.i!==undefined)return A[act](+el.dataset.i);
  A[act]?.();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&tradeOpen){A.closeTrade();return}if(e.key==='Enter'&&(e.target.id==='nameIn'||e.target.id==='codeIn')){e.preventDefault();e.target.id==='codeIn'?A.open():state?A.join():A.create()}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='nameIn')myName=t.value;
  if(t.id==='giveCash'){tradeDraft.giveCash=Math.max(0,+t.value||0);render()}
  if(t.id==='getCash'){tradeDraft.getCash=Math.max(0,+t.value||0);render()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.trade){const k=t.dataset.trade,v=+t.value;tradeDraft[k]=t.checked?[...tradeDraft[k],v]:tradeDraft[k].filter(x=>x!==v)}
  if(t.id==='tradeTo'){tradeDraft.to=t.value;tradeDraft.get=[];tradeDraft.getImm=[];render()}
  if(t.id==='tradeUses')tradeDraft.uses=+t.value;
});
document.addEventListener('toggle',e=>{if(e.target.id==='tradeDetails')tradeDraft.open=e.target.open},true);

/* ---------- Boot ---------- */
render();
(async()=>{
  for(let k=0;k<20&&!window.claude?.use;k++)await sleep(100);
  if(window.claude?.use){
    [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(user){try{myId=await user.id();canWrite=await user.can('data.write')}catch(e){}}
    if(!myId){try{myId=localStorage.getItem('qct-pid')}catch(e){}
      if(!myId){myId='g_'+Math.random().toString(36).slice(2,12)+Date.now().toString(36);try{localStorage.setItem('qct-pid',myId)}catch(e){}}}
  }
  ready=true;
  if(!db){render();return}
  unsubLobby=db.collection('games').orderBy('updatedAt','desc').limit(15).onSnapshot(q=>{games=q.docs.map(d=>d.data());if(!state)render()},()=>{});
  let code=(location.hash||'').slice(1).toUpperCase();
  if(!/^[A-Z0-9]{4}$/.test(code)){try{code=localStorage.getItem('qct-game')||''}catch(e){code=''}}
  if(code)openGame(code);else render();
})();
</script>
