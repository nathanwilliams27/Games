# One-click deploy on Render (render.com): New > Blueprint > pick this repo
services:
  - type: web
    name: skreets-of-maple-ridge
    runtime: node
    plan: free
    buildCommand: "echo no build needed"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
    # On a paid plan, uncomment this so games survive redeploys and restarts:
    # disk:
    #   name: game-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # and add an env var DATA_DIR = /var/data
